    hasKilledHardDragon: true
    playerKills: 5
    eventPoints: 100

# Engagement / YouTube Strategy
engagement:
  enabled: true
  # Interval in minutes between automated broadcasts
  interval_minutes: 15
  # Random messages to encourage YouTube participation
  messages:
    - "§b[YouTube] §f24時間配信中！高評価とチャンネル登録お願いします！"
    - "§b[YouTube] §fこのサーバーが面白いと思ったら、ぜひYouTubeの配信も覗いてみてね！"
    - "§b[YouTube] §fチャンネル登録者が増えると、サーバーに新しい機能が追加されるかも...？"
