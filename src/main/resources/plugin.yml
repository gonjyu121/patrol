# src/main/resources/plugin.yml
name: PatrolSpectatorPlugin
main: dev.gonjy.patrolspectator.PatrolSpectatorPlugin
version: ${project.version}
api-version: '1.21'
authors: [ 'gonjy' ]
commands:
  patrol:
    description: 観光巡りコマンド
    usage: /patrol <rescue|escape|invite|accept|deny|start|stop|status|rank|spawnreset>
  bounty:
    description: 賞金首コマンド
    usage: /bounty <info|claim>
    permission: patrol.bounty.use
  stats:
    description: 自分の統計情報と進捗を表示します
    usage: /stats
  dungeon:
    description: 迷宮管理コマンド (Admin用)
    usage: /dungeon <status|tp|reset|build|scan|enable|disable>
    permission: patrol.dungeon.admin
permissions:
  patrol.rescue:
    description: リスキル救済コマンドを使用できます
    default: true
  patrol.escape:
    description: 閉じ込め脱出コマンドを使用できます
    default: true
  patrol.teleport:
    description: 承認制のプレイヤー間テレポートを使用できます
    default: true
  patrol.dungeon.admin:
    default: op
  patrolspectator.use:
    default: op
  patrolspectator.exempt:
    default: false
